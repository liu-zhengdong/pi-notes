name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm test && npm run test:package
      - name: Rehearse tarball publish
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tarball="$(find ./release -maxdepth 1 -name '*.tgz')"
          if [[ -z "$tarball" || "$tarball" == *$'\n'* ]]; then
            echo "expected exactly one release tarball" >&2
            exit 1
          fi
          if npm view "$name@$version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$name@$version already published; skip dry-run"
          else
            npm publish "$tarball" --dry-run --access public
          fi
